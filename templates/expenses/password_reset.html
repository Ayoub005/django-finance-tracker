<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Finance Tracker</title>
    
    <!-- YOUR CUSTOM BROWSER TAB ICON -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%2306b6d4'/%3E%3Cstop offset='100%25' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='25' fill='url(%23g)'/%3E%3Cpath d='M 26 58 L 42 42 L 54 54 L 72 36 L 72 50 M 72 36 L 58 36' fill='none' stroke='white' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* FIX: Prevent Browser Autofill from turning inputs white */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            transition: background-color 5000s ease-in-out 0s;
            -webkit-text-fill-color: #f8fafc !important;
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            caret-color: #c084fc !important;
        }

        /* Ambient Background Violet Glow */
        .ambient-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.08) 0%, transparent 70%);
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
        }

        /* Cinematic Violet-to-Fuchsia Text Gradient */
        .text-shine {
            background: linear-gradient(to right, #ffffff 20%, #c084fc 50%, #ffffff 80%);
            background-size: 200% auto;
            color: #fff;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineSweep 4s linear infinite;
        }
        @keyframes shineSweep { to { background-position: 200% center; } }

        .animate-fade-up { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
        .delay-100 { animation-delay: 150ms; }
        .delay-200 { animation-delay: 250ms; }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        /* Sleek Glass Card with Violet Border */
        .glass-card {
            position: relative;
            border-radius: 2rem;
            padding: 1px;
            z-index: 10;
            background: linear-gradient(135deg, rgba(192, 132, 252, 0.5), rgba(139, 92, 246, 0.2), rgba(15, 23, 42, 0.9));
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        .acrylic-grain {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        }

        .pro-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(51, 65, 85, 0.6);
            transition: all 0.3s ease;
        }
        .pro-input:focus-within {
            background: rgba(15, 23, 42, 0.95);
            border-color: #c084fc;
            box-shadow: 0 0 0 1px #c084fc, 0 10px 15px -3px rgba(192, 132, 252, 0.15);
        }

        /* Live Interactive Violet Canvas */
        #security-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="security-canvas"></canvas>
    <div class="ambient-glow"></div>

    <div class="glass-card w-full max-w-md mx-4 animate-fade-up">
        <div class="bg-slate-950/90 acrylic-grain backdrop-blur-3xl p-10 rounded-[1.95rem] h-full w-full relative z-20">

            <div class="text-center mb-8">
                <!-- Violet Shield/Key Icon -->
                <div class="mx-auto w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-500/25 to-indigo-600/25 flex items-center justify-center mb-5 border border-purple-500/30 shadow-[0_0_20px_rgba(168,85,247,0.2)]">
                    <svg class="w-6 h-6 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                </div>

                <div class="animate-fade-up">
                    <h2 class="text-2xl font-extrabold tracking-tight pb-1 text-shine">Reset Password</h2>
                </div>

                <p class="text-slate-400 mt-1 text-sm font-medium tracking-wide animate-fade-up delay-100">
                    Enter your email to reset your password for <span class="font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-400">Finance Tracker</span>
                </p>
            </div>

            <form method="POST" class="space-y-5">
                {% csrf_token %}

                <div class="relative group pro-input rounded-xl animate-fade-up delay-100">
                    <input type="email" name="email" required id="email" placeholder=" " class="block w-full px-5 pt-6 pb-2 text-white bg-transparent border-none appearance-none focus:outline-none focus:ring-0 peer">
                    <label for="email" class="absolute text-xs font-bold text-slate-500 duration-300 transform -translate-y-3 scale-75 top-4 z-10 origin-[0] left-5 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-3 peer-focus:text-purple-400 uppercase tracking-wider">Email Address</label>
                </div>

                {% if form.errors %}
                    <div class="p-3 bg-red-950/40 border border-red-900/50 text-red-400 rounded-xl text-xs font-bold backdrop-blur-sm animate-fade-up delay-100">
                        {{ form.email.errors }}
                    </div>
                {% endif %}

                <div class="pt-2 animate-fade-up delay-200">
                    <button type="submit" class="group relative w-full overflow-hidden bg-purple-600 hover:bg-purple-500 text-white py-4 rounded-xl font-bold text-sm shadow-[0_0_20px_rgba(168,85,247,0.3)] transition-all duration-300 hover:shadow-[0_0_35px_rgba(168,85,247,0.5)]">
                        <span class="relative z-10 tracking-widest uppercase">Send Reset Link</span>
                        <div class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/30 to-transparent group-hover:animate-[shimmer_1.5s_ease-in-out]"></div>
                    </button>
                </div>

                <div class="mt-8 text-center text-xs font-bold text-slate-500 animate-fade-up delay-200">
                    Remembered your password?
                    <a href="{% url 'login' %}" class="text-purple-400 ml-1 transition-all duration-300 hover:text-white hover:underline underline-offset-4">Return to Login</a>
                </div>
            </form>
        </div>
    </div>

    <style> @keyframes shimmer { 100% { transform: translateX(100%); } } </style>

    <script>
        // Live Violet/Purple Interactive Node Canvas Animation
        const canvas = document.getElementById('security-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, nodes = [];

        const mouse = { x: null, y: null, radius: 180 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class SecurityNode {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.size = Math.random() * 2 + 1;
                this.baseAlpha = Math.random() * 0.3 + 0.1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < mouse.radius) {
                    let force = (mouse.radius - dist) / mouse.radius;
                    this.x -= (dx / dist) * force * 1.5;
                    this.y -= (dy / dist) * force * 1.5;
                    this.alpha = Math.min(this.baseAlpha + 0.5, 0.9);
                } else {
                    this.alpha = this.baseAlpha;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(192, 132, 252, ${this.alpha})`;
                ctx.fill();
            }
        }

        function init() {
            nodes = [];
            for (let i = 0; i < (width * height) / 20000; i++) {
                nodes.push(new SecurityNode());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            nodes.forEach((n, index) => {
                n.update();
                n.draw();

                for (let j = index + 1; j < nodes.length; j++) {
                    let n2 = nodes[j];
                    let dx = n.x - n2.x;
                    let dy = n.y - n2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(n.x, n.y);
                        ctx.lineTo(n2.x, n2.y);
                        ctx.strokeStyle = `rgba(168, 85, 247, ${(1 - dist / 120) * 0.15})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            });

            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
