<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Finance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%2306b6d4'/%3E%3Cstop offset='100%25' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='25' fill='url(%23g)'/%3E%3Cpath d='M 26 58 L 42 42 L 54 54 L 72 36 L 72 50 M 72 36 L 58 36' fill='none' stroke='white' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: #f8fafc; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="relative max-w-md w-full bg-slate-950/80 backdrop-blur-2xl p-8 rounded-[2rem] border border-slate-800 shadow-2xl text-center">
        <div class="absolute -inset-0.5 bg-gradient-to-r from-cyan-500 to-blue-500 rounded-[2.5rem] blur opacity-30 pointer-events-none"></div>

        <div class="relative z-10">
            <div class="mx-auto w-14 h-14 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/40 mb-6">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            </div>

            <h2 class="text-2xl font-extrabold text-white tracking-tight mb-2">Check Your Email</h2>
            <p class="text-sm text-gray-400 mb-6">We've sent a 6-digit verification code to your email address. Enter it below to activate your account.</p>

            {% if error %}
                <div class="mb-4 p-3 bg-red-950/50 border border-red-900 rounded-xl text-xs text-red-400 font-bold">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" class="space-y-5">
                {% csrf_token %}
                <input type="text" name="otp" maxlength="6" required placeholder="123456" class="w-full text-center tracking-widest text-2xl py-3 rounded-xl bg-slate-900 border border-slate-700 text-white font-bold focus:ring-2 focus:ring-cyan-500 focus:outline-none">

                <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white py-3.5 rounded-xl font-bold shadow-lg shadow-cyan-500/30 transition-all hover:scale-[1.02]">
                    Verify Code
                </button>
            </form>
        </div>
    </div>

</body>
</html>
