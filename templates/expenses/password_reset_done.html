<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Updated - Finance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%2306b6d4'/%3E%3Cstop offset='100%25' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='25' fill='url(%23g)'/%3E%3Cpath d='M 26 58 L 42 42 L 54 54 L 72 36 L 72 50 M 72 36 L 58 36' fill='none' stroke='white' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Emerald Glow */
        .ambient-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, transparent 70%);
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
        }

        /* Cinematic Text Gradient */
        .text-shine {
            background: linear-gradient(to right, #ffffff 20%, #34d399 50%, #ffffff 80%);
            background-size: 200% auto;
            color: #fff;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineSweep 4s linear infinite;
        }
        @keyframes shineSweep { to { background-position: 200% center; } }

        .animate-fade-up { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
        .delay-100 { animation-delay: 150ms; }
        .delay-200 { animation-delay: 250ms; }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        .animate-float { animation: float 4s ease-in-out infinite; }

        /* Sleek Glass Card with Emerald Border */
        .success-card {
            position: relative;
            border-radius: 2rem;
            padding: 1px;
            z-index: 10;
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.5), rgba(16, 185, 129, 0.2), rgba(15, 23, 42, 0.9));
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        .acrylic-grain {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        }

        #success-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="success-canvas"></canvas>
    <div class="ambient-glow"></div>

    <div class="success-card w-full max-w-md mx-4 animate-fade-up">
        <div class="bg-slate-950/90 acrylic-grain backdrop-blur-3xl p-10 rounded-[1.95rem] h-full w-full relative z-20 text-center">

            <!-- Success Icon with Glowing Ring -->
            <div class="relative mx-auto w-16 h-16 mb-6 flex items-center justify-center">
                <div class="absolute inset-0 rounded-2xl bg-emerald-500/20 animate-ping opacity-75"></div>
                <div class="relative w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-500/25 to-teal-600/25 flex items-center justify-center border border-emerald-500/40 shadow-[0_0_25px_rgba(16,185,129,0.3)] animate-float">
                    <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                </div>
            </div>

            <div class="animate-fade-up">
                <h2 class="text-2xl font-extrabold tracking-tight pb-1 text-shine">Password Updated</h2>
            </div>

            <p class="text-slate-400 mt-3 mb-8 text-sm font-medium tracking-wide animate-fade-up delay-100 leading-relaxed">
                Your password has been successfully reset. You can now sign in to <span class="font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-400">Finance Tracker</span> with your new credentials
            </p>

            <div class="animate-fade-up delay-200">
                <a href="{% url 'login' %}" class="group relative w-full inline-flex justify-center items-center overflow-hidden bg-emerald-600 hover:bg-emerald-500 text-white py-4 rounded-xl font-bold text-sm shadow-[0_0_20px_rgba(16,185,129,0.3)] transition-all duration-300 hover:shadow-[0_0_35px_rgba(16,185,129,0.5)]">
                    <span class="relative z-10 tracking-widest uppercase">Go to Login</span>
                    <div class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/30 to-transparent group-hover:animate-[shimmer_1.5s_ease-in-out]"></div>
                </a>
            </div>
        </div>
    </div>

    <style> @keyframes shimmer { 100% { transform: translateX(100%); } } </style>

    <script>
        // Live Interactive Emerald Crystal Lattice Canvas Animation
        const canvas = document.getElementById('success-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, nodes = [];

        const mouse = { x: null, y: null, radius: 180 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class SuccessNode {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.size = Math.random() * 2 + 1;
                this.baseAlpha = Math.random() * 0.3 + 0.1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < mouse.radius) {
                    let force = (mouse.radius - dist) / mouse.radius;
                    this.x -= (dx / dist) * force * 1.5;
                    this.y -= (dy / dist) * force * 1.5;
                    this.alpha = Math.min(this.baseAlpha + 0.5, 0.9);
                } else {
                    this.alpha = this.baseAlpha;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(52, 211, 153, ${this.alpha})`;
                ctx.fill();
            }
        }

        function init() {
            nodes = [];
            for (let i = 0; i < (width * height) / 20000; i++) {
                nodes.push(new SuccessNode());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            nodes.forEach((n, index) => {
                n.update();
                n.draw();

                for (let j = index + 1; j < nodes.length; j++) {
                    let n2 = nodes[j];
                    let dx = n.x - n2.x;
                    let dy = n.y - n2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(n.x, n.y);
                        ctx.lineTo(n2.x, n2.y);
                        ctx.strokeStyle = `rgba(16, 185, 129, ${(1 - dist / 120) * 0.15})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            });

            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
